<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://timothyolivieri.github.io/raw/asset/css/reset.css">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code</title>
  </head>
  <body>
    <main>
      <page route="/gists"></page>
      <page class="active" route="/gists/code">
        <blocks>
          <header css-border-bottom="1px solid black" css-position="fixed" css-width="100%" css-justify-content="center" css-z-index="12">
            <section>
              <card>
                <row>
                  <box css-margin-right="auto">
                    <a href="../">
                      <ico>
                        <n class="gg-home"></n>
                      </ico>
                      <text>Gists</text>
                    </a>
                  </box>
                  <box css-margin-left="auto">
                    <a>
                      <ico>
                        <n class="gg-menu"></n>
                      </ico>
                    </a>
                  </box>
                </row>
              </card>
            </section>
          </header>
          <block css-display="none" css-dw480px-display="flex">
            <section>
              <card>
                <row>
                  <box>
                    <row>
                      <text>HTML</text>
                      <i><con></con></i>
                    </row>
                  </box>
                  <box>
                    <row>
                      <text>CSS</text>
                      <i><con></con></i>
                    </row>
                  </box>
                  <box>
                    <row>
                      <text>JS</text>
                      <i><con></con></i>
                    </row>
                  </box>
                </row>
              </card>
            </section>
          </block>
          <block css-flex="1">
            <section css-flex-direction="row">
              <card css-width="320px" css-height="100%">
                <section css-flex-direction="column">
                  <box css-height="calc(100%/3)">
                    <header>HTML</header>
                    <section id="CodeMirrorHTML"></section>
                  </box>
                  <box css-height="calc(100%/3)">
                    <header>CSS</header>
                    <section id="CodeMirrorCSS"></section>
                  </box>
                  <box css-height="calc(100%/3)">
                    <header>JS</header>
                    <section id="CodeMirrorJS"></section>
                  </box>
                </section>
              </card>
              <card css-flex="1" css-flex-direction="row">
                <line css-width="5px" css-border-left="1px solid black" css-border-right="1px solid black" css-height="100%"></line>
                <iframe id="iframe-code"></iframe>
              </card>
            </section>
          </block>
        </blocks>
      </page>
      <page route="/gists/user"></page>
    </main>
  </body>
</html>
