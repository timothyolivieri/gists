<html lang="en"><head>
    <title>Gists</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://timothyolivieri.github.io/raw/asset/css/reset.css">
    <link rel="stylesheet" href="./style.css">
    <script src="https://timothyolivieri.github.io/raw/asset/js/vanilla.js"></script>
    <script src="./script.js"></script>
  </head>
  <body>
    <main>
      <page class="active" route="/gists">
        <blocks>
          <header css-border-bottom="1px solid black" css-position="fixed" css-width="100%" css-justify-content="center" css-z-index="12">
            <section>
              <card>
                <row>
                  <box css-margin-right="auto">
                    <a>
                      <ico>
                        <n class="gg-home"></n>
                      </ico>
                      <text>Gists</text>
                    </a>
                  </box>
                  <box css-margin-left="auto">
                    <a href="./gist">
                      <ico>
                        <n class="gg-math-plus"></n>
                      </ico>
                    </a>
                  </box>
                  <box>
                    <a href="./user">
                      <ico>
                        <n class="gg-user"></n>
                      </ico>
                    </a>
                  </box>
                </row>
              </card>
            </section>
          </header>
          <block>
            <template>
              <card>
                <row>
                  <picture css-height="30px" css-width="30px"><img css-border-radius="50%"></picture>
                  <text>
                    <div><a class="username">username</a> / <a class="filename">filename</a></div>
                    <div class="created">Created 3 weeks ago</div>
                    <div class="description"></div>
                  </text>
                </row>
              </card>
            </template>
            <column css-gap="20px" css-padding-top="50px" id="feed-gists"></column>
          </block>
        </blocks>
      </page>
      <page route="/gists/code"></page>
      <page route="/gists/user"></page>
    </main>
  </body>
</html>
