<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://timothyolivieri.github.io/raw/asset/css/reset.css">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User</title>
  </head>
  <body>
    <main>
      <page route="/gists"></page>
      <page route="/gists/code"></page>
      <page class="active" route="/gists/user">
        <blocks auth="false">
          <header>
            <section>
              <card>
                <row>
                  <box css-margin-right="auto">
                    <a>
                      <ico>
                        <n></n>
                      </ico>
                      <text>Gists</text>
                    </a>
                  </box>
                  <box>
                    <a>
                      <ico>
                        <n></n>
                      </ico>
                    </a>
                  </box>
                  <box>
                    <a>
                      <ico>
                        <n></n>
                      </ico>
                    </a>
                  </box>
                </row>
              </card>
            </section>
          </header>
          <block css-height="100%" css-min-height="240px">
            <section>
              <card css-margin="20px auto" css-text-align="center">
                <column>
                  <box>
                    <header css-font-size="22px">Enter GitHub Access Key</header>
                    <form css-flex-direction="column">                      
                      <input css-border="1px solid black" css-border-radius="20px" css-width="100%" type="password">
                      <ico>
                        <n></n>
                        <input type="submit">
                      </ico>
                    </form>
                  </box>
                  <box css-line-height="72px">
                    <section>
                      <text>or</text>
                    </section>
                  </box>
                  <box css-color="white" css-background="black" css-border-radius="20px" css-line-height="40px" css-width="200px">
                    <row>
                      <ico css-height="20px" css-width="20px"><n></n></ico>
                      <text>Signin with GitHub
                    </row>
                  </box>
                </column>
              </card>
          </block>
        </blocks>
        <blocks auth="true">
          <block>
            <section>
              <card>
                <row>
                  <picture><img></picture>
                  <text>username</text>
                </row>
              </card>
            </section>
          </block>
        </blocks>
      </page>
    </main>
  </body>
</html>
